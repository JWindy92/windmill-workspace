name: Deploy Windmill

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy"
        required: true
        default: main
        type: choice
        options:
          - main
          - develop

permissions:
  contents: read

concurrency:
  group: windmill-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Windmill CLI
        run: npm install -g windmill-cli

      - name: Deploy to Windmill
        env:
          WMILL_TOKEN: ${{ secrets.WMILL_TOKEN }}
          WMILL_BASE_URL: ${{ vars.WMILL_BASE_URL }}
        run: |
          wmill sync push \
            --yes \
            --auto-metadata \
            --skip-variables \
            --skip-resources \
            --include-schedules \
            --workspace home \
            --token "$WMILL_TOKEN" \
            --base-url "http://10.0.0.237:8001"
